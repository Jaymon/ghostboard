[project]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
description = "Start it with a filepath and it will write everything you copy to the system clipboard to a file"
authors = [
  { name = "Jay Marcyes", email = "jay@marcyes.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
  "Programming Language :: Python :: 2.7"
]
dependencies = [
  "pyperclip"
]
license-files = [
  "LICENSE.txt"
]

[build-system]
requires = [
  "setuptools>=62.3.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
  "tests*",
  "example*",
  "*_test*",
  "docs*"
]

[project.urls]
Repository = "https://github.com/Jaymon/ghostboard"
Homepage = "http://github.com/Jaymon/ghostboard"

[project.scripts]
ghostboard = "ghostboard:console"

